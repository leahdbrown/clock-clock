<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pico Tester</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #21262d;
      --border:    #30363d;
      --text:      #e6edf3;
      --dim:       #8b949e;
      --green:     #3fb950;
      --blue:      #58a6ff;
      --amber:     #d29922;
      --red:       #f85149;
      --accent:    #1f6feb;
      --accent-bg: #0d419d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    header h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }

    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #status-dot.on { background: var(--green); }

    #status-label { color: var(--dim); font-size: 12px; }

    /* ── Layout ── */
    main {
      display: grid;
      grid-template-columns: 1fr 268px;
      flex: 1;
      min-height: 0;
    }

    /* ── Terminal ── */
    #terminal-col {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      min-height: 0;
    }

    .col-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 5px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      flex-shrink: 0;
    }

    #terminal {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.65;
      background: var(--bg);
    }

    #terminal::-webkit-scrollbar { width: 5px; }
    #terminal::-webkit-scrollbar-track { background: transparent; }
    #terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .ln { white-space: pre-wrap; word-break: break-all; }
    .ln-rx   { color: var(--green); }
    .ln-tx   { color: var(--blue); }
    .ln-sys  { color: var(--dim); font-style: italic; }
    .ln-err  { color: var(--red); }

    /* ── Controls ── */
    #controls-col {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: var(--surface);
    }

    #controls-col::-webkit-scrollbar { width: 5px; }
    #controls-col::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .card {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      font-size: 10px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--dim);
      margin-bottom: 4px;
    }

    select, input[type="number"], input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    select:focus, input:focus { border-color: var(--accent); }

    /* Fix select arrow color */
    select { color-scheme: dark; }

    button {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }

    button:hover:not(:disabled) { background: var(--border); }
    button:disabled { opacity: 0.4; cursor: default; }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { background: #388bfd; border-color: #388bfd; }

    button.danger { border-color: var(--red); color: var(--red); }
    button.danger:hover:not(:disabled) { background: rgba(248,81,73,0.1); }

    .row { display: flex; gap: 6px; margin-top: 6px; }
    .row > * { flex: 1; }

    /* Stepper row */
    .stepper { display: flex; gap: 4px; align-items: center; }
    .stepper input { flex: 1; text-align: center; }
    .stepper .adj {
      width: 30px; height: 32px;
      padding: 0;
      font-size: 16px;
      flex-shrink: 0;
    }

    /* Raw command */
    .inline { display: flex; gap: 6px; margin-top: 6px; }
    .inline input { flex: 1; }
    .inline button { flex-shrink: 0; }

    .mt { margin-top: 6px; }
    .full { width: 100%; }
  </style>
</head>
<body>

<header>
  <span id="status-dot"></span>
  <h1>Pico Tester</h1>
  <span id="status-label">disconnected</span>
</header>

<main>
  <!-- Terminal -->
  <div id="terminal-col">
    <div class="col-header">
      <span>serial output</span>
      <button style="font-size:10px;padding:2px 8px;" onclick="clearTerminal()">clear</button>
    </div>
    <div id="terminal"></div>
  </div>

  <!-- Controls -->
  <div id="controls-col">

    <!-- Connection -->
    <div class="card">
      <div class="card-title">connection</div>
      <label>port</label>
      <select id="port-select"></select>
      <div class="row mt">
        <button onclick="refreshPorts()" style="font-size:11px;">Refresh</button>
        <button id="conn-btn" class="primary" onclick="toggleConnect()">Connect</button>
      </div>
    </div>

    <!-- Angle -->
    <div class="card">
      <div class="card-title">angle</div>
      <label>degrees</label>
      <div class="stepper">
        <button class="adj" onclick="nudge('angle-val', -10)">−</button>
        <input type="number" id="angle-val" value="90">
        <button class="adj" onclick="nudge('angle-val', 10)">+</button>
      </div>
      <div class="row">
        <button class="mt" onclick="sendBuiltin('ANGLE', 'angle-val')">Send ANGLE</button>
      </div>
    </div>

    <!-- Frequency -->
    <div class="card">
      <div class="card-title">frequency</div>
      <label>steps / sec</label>
      <input type="number" id="freq-val" value="500" min="1" max="10000">
      <div class="row">
        <button class="mt" onclick="sendBuiltin('FREQ', 'freq-val')">Send FREQ</button>
      </div>
    </div>

    <!-- Raw command -->
    <div class="card">
      <div class="card-title">raw command</div>
      <div class="inline">
        <input type="text" id="raw-input" placeholder="CMD:value"
          onkeydown="if(event.key==='Enter') sendRaw()">
        <button onclick="sendRaw()">Send</button>
      </div>
    </div>

  </div>
</main>

<script>
  let isConnected = false;

  // ── WebSocket ──────────────────────────────────────────────
  let ws;

  function openWS() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = ({ data }) => {
      if (data.startsWith('[') || data.startsWith('[session')) appendLine(data, 'sys');
      else appendLine(data, 'rx');
    };
    ws.onclose = () => setTimeout(openWS, 1500);
  }
  openWS();

  // ── Terminal ───────────────────────────────────────────────
  const terminal = document.getElementById('terminal');

  function appendLine(text, type = 'rx') {
    const div = document.createElement('div');
    div.className = `ln ln-${type}`;

    // Classify system/error messages that come over WS
    if (type === 'rx') {
      if (text.startsWith('[') && text.endsWith(']')) type = 'sys';
      if (text.toLowerCase().includes('error')) type = 'err';
      div.className = `ln ln-${type}`;
    }

    div.textContent = text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
  }

  function clearTerminal() { terminal.innerHTML = ''; }

  // ── Ports ──────────────────────────────────────────────────
  async function refreshPorts() {
    const res = await fetch('/ports');
    const ports = await res.json();
    const sel = document.getElementById('port-select');
    const prev = sel.value;

    sel.innerHTML = '<option value="">— select port —</option>';
    ports.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.device;
      opt.textContent = p.suggested
        ? `★ ${p.device}`
        : `${p.device}  (${p.description})`;
      sel.appendChild(opt);
    });

    // Restore selection or auto-pick suggested
    if (prev && [...sel.options].some(o => o.value === prev)) {
      sel.value = prev;
    } else {
      const suggested = ports.find(p => p.suggested);
      if (suggested) sel.value = suggested.device;
    }
  }

  // ── Connection ─────────────────────────────────────────────
  async function toggleConnect() {
    if (isConnected) {
      await fetch('/disconnect', { method: 'POST' });
      setConnected(false, '');
    } else {
      const port = document.getElementById('port-select').value;
      if (!port) { appendLine('[select a port first]', 'err'); return; }

      const res = await fetch('/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ port }),
      });
      const data = await res.json();
      if (res.ok) setConnected(true, data.port);
      else appendLine(`[error: ${data.error}]`, 'err');
    }
  }

  function setConnected(on, port) {
    isConnected = on;
    document.getElementById('status-dot').className = on ? 'on' : '';
    document.getElementById('status-label').textContent = on ? port : 'disconnected';
    const btn = document.getElementById('conn-btn');
    btn.textContent = on ? 'Disconnect' : 'Connect';
    btn.className = on ? 'danger' : 'primary';
  }

  // ── Commands ───────────────────────────────────────────────
  async function sendCmd(cmd) {
    const res = await fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmd }),
    });
    if (res.ok) {
      appendLine(`> ${cmd}`, 'tx');
    } else {
      const data = await res.json();
      appendLine(`[error: ${data.error}]`, 'err');
    }
  }

  function nudge(id, delta) {
    const el = document.getElementById(id);
    el.value = (parseFloat(el.value) || 0) + delta;
  }

  function sendBuiltin(prefix, inputId) {
    const val = document.getElementById(inputId).value;
    sendCmd(`${prefix}:${val}`);
  }

  function sendRaw() {
    const el = document.getElementById('raw-input');
    const cmd = el.value.trim();
    if (!cmd) return;
    sendCmd(cmd);
    el.value = '';
  }

  // ── Init ───────────────────────────────────────────────────
  async function init() {
    await refreshPorts();
    const res = await fetch('/status');
    const { connected, port } = await res.json();
    if (connected) setConnected(true, port);
  }
  init();
</script>
</body>
</html>
